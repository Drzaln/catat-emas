name: Build & Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "build-tools;36.1.0" "platform-tools" >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        if: env.SIGNING_KEY != ''
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}"
          } > "$GITHUB_WORKSPACE/keystore.properties"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -Pgithub.repo="${GITHUB_REPOSITORY}"

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
